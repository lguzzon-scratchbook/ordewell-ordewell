name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# A new push to a PR makes the in-flight run obsolete; don't pay for it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Linux only, deliberately.
  #
  # Ordewell supports macOS and Windows (ADR-0010) and it would be better to
  # prove that here than to assert it in the README. The blocker is npm's
  # optional-dependency handling: a lockfile resolved on Linux records only the
  # Linux binaries for rollup and esbuild, so `npm ci` on a macOS or Windows
  # runner fails at the first build with "Cannot find module
  # @rollup/rollup-darwin-arm64". `npm install --package-lock-only` does not fix
  # it — it resolves against the host platform too.
  #
  # Adding the matrix therefore means either committing a lockfile built to
  # carry every platform's binaries, or dropping to `npm install` off-Linux and
  # giving up reproducible dependency resolution there. Both are real changes
  # that deserve their own review, so the matrix is not here yet.
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js 22.x
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build (core first — cli, web and vscode compile against its dist/)
        run: npm run build:core

      # Skills seeding, slash invocation and the settings migration, each run
      # against the built core in a throwaway HOME.
      - name: Verify scripts (offline, against the built core)
        run: |
          for f in scripts/verify-*.mjs; do
            node "$f" || exit 1
          done

      - name: Planner conversation loop — offline e2e (mock model, no API key)
        run: |
          node bench/live/mock-provider.mjs &
          MOCK_PID=$!
          trap 'kill $MOCK_PID 2>/dev/null' EXIT
          # Wait for the mock provider to bind its port rather than a fixed sleep,
          # which raced on loaded runners and orphaned the mock on drive failure.
          for i in $(seq 1 50); do
            if node -e "require('net').connect(3799).on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"; then break; fi
            sleep 0.2
          done
          node bench/live/drive-conversation.mjs

      - name: Build (vscode, cli & web)
        run: npm run build -w packages/vscode -w packages/cli -w packages/web --if-present

      # The extension integration test drives a real VS Code instance. Cache the
      # ~320 MB download so only the first run on a new VS Code version pays for
      # it; `test:integration` builds its own bundle (tsup.integration.config.ts).
      - name: Cache the VS Code download
        uses: actions/cache@v4
        with:
          path: packages/vscode/.vscode-test
          key: vscode-test-${{ runner.os }}-${{ hashFiles('packages/vscode/package.json') }}

      - name: Install xvfb if the image lacks it
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y xvfb
          fi

      - name: VS Code integration test (synthetic runner — no API key)
        env:
          ORDEWELL_TEST_WORKSPACE: ${{ runner.temp }}/ordewell-integration-workspace
        run: |
          mkdir -p "$ORDEWELL_TEST_WORKSPACE"
          xvfb-run -a npm run test:integration -w ordewell

      - name: Typecheck
        run: npm run typecheck

      # Coverage is report-only for the codebase as a whole: no overall
      # threshold, so a percentage never fails the build. The one exception is
      # a per-file floor on the modules the seam refactors introduced (see
      # `thresholds` in packages/core/vitest.config.ts), set at each file's
      # measured value so those seams cannot quietly lose their tests.
      - name: Test with coverage
        shell: bash
        run: |
          set -o pipefail
          npm run test:coverage 2>&1 | tee coverage.log

      - name: Append coverage summaries to the job summary
        if: always()
        shell: bash
        run: |
          node --input-type=module - <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          import { existsSync, readFileSync } from 'node:fs';
          if (!existsSync('coverage.log')) process.exit(0);
          const log = readFileSync('coverage.log', 'utf8');
          const chunks = log.split(/^> (\S+)@\S+ test:coverage\s*$/m);
          const out = [];
          for (let i = 1; i < chunks.length; i += 2) {
            const name = chunks[i];
            const body = chunks[i + 1] ?? '';
            const marker = body.indexOf('Coverage summary');
            if (marker < 0) continue;
            const rest = body.slice(body.lastIndexOf('\n', marker) + 1);
            const end = rest.search(/\n={20,}/);
            const summary = (end < 0 ? rest : rest.slice(0, end)).trimEnd();
            out.push(`### Coverage — \`${name}\``, '', '```', summary, '```', '');
          }
          process.stdout.write(out.join('\n'));
          NODE

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: packages/*/coverage/
          if-no-files-found: warn

      - name: Lint
        run: npm run lint

      - name: Package VS Code Extension
        run: npm run package -w packages/vscode

      - name: Upload .vsix
        uses: actions/upload-artifact@v4
        with:
          name: ordewell-vsix
          path: packages/vscode/*.vsix
          if-no-files-found: error
